<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Vue + TS</title>
    <!-- 百度地图JavaScript API -->
    <!-- 注意：请将YOUR_API_KEY替换为您的实际百度地图API密钥 -->
    <!-- 如果没有API密钥，可以到百度地图开放平台申请：https://lbsyun.baidu.com/ -->
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=YOUR_API_KEY&callback=initBaiduMap"></script>
    <script>
      // 百度地图API加载完成后的回调函数
      window.initBaiduMap = function() {
        console.log('百度地图API加载完成');
        window.baiduMapReady = true;
      }
      
      // 如果没有配置API密钥，提供模拟数据
      window.baiduMapReady = false;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
